name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master  # Se déclenche lors d'un push sur master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Vrai seulement si le secret SUPABASE_ACCESS_TOKEN existe dans les réglages du dépôt
      HAS_SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Version minimale requise par Vitest
          cache: npm

      - name: Install 📦
        run: npm ci  # Installe exactement les versions du package-lock.json

      # Un lint ou un test en échec bloque le déploiement
      - name: Lint 🔍
        run: npm run lint

      - name: Test 🧪
        run: npm test

      # Applique en production les migrations qui manquent, avant de publier le frontend qui en dépend.
      # Étape ignorée tant que le secret SUPABASE_ACCESS_TOKEN n'est pas configuré.
      - name: Migrations 🗄️
        if: env.HAS_SUPABASE_TOKEN == 'true'
        run: npx supabase db push --project-ref ikxsleqnywxzqcqkmytg --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build 🔧
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Le dossier généré par Vite
          branch: gh-pages # La branche de destination pour l'hébergement
