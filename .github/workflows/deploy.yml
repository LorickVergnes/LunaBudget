name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master  # Se déclenche lors d'un push sur master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Version minimale requise par Vitest
          cache: npm

      - name: Install 📦
        run: npm ci  # Installe exactement les versions du package-lock.json

      # Un lint ou un test en échec bloque le déploiement
      - name: Lint 🔍
        run: npm run lint

      - name: Test 🧪
        run: npm test

      - name: Build 🔧
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Le dossier généré par Vite
          branch: gh-pages # La branche de destination pour l'hébergement
